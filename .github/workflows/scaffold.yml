# Maakt eenmalig het Laravel 13-project aan (zoals `laravel new boekenbos` met de
# Livewire-starterkit) en tagt het als de stand na les 4.1.1. Draait opnieuw als
# dit bestand verandert, maar doet niets meer zodra er al een project staat.
name: scaffold

on:
  push:
    paths: ['.github/workflows/scaffold.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Laravel-installer
        run: |
          composer global require laravel/installer --no-interaction
          echo "$(composer global config bin-dir --absolute -q)" >> "$GITHUB_PATH"

      - name: Opties van de installer tonen
        run: |
          laravel --version
          echo "::notice title=laravel new --help::$(laravel new --help | tr '\n' '|' | cut -c1-3500)"

      - name: Nieuw project
        shell: bash
        run: |
          set -eo pipefail
          trap 'echo "::error title=Mislukt bij::$BASH_COMMAND"' ERR
          if [ -f artisan ]; then echo "Er staat al een project."; exit 0; fi
          cd /tmp
          laravel new boekenbos --livewire --pest --database=sqlite --npm --no-boost --no-interaction
          cd boekenbos
          echo "::notice title=Versie::$(php artisan --version)"
          echo "::notice title=Bestanden::$(ls -A | tr '\n' ' ')"
          echo "::notice title=routes/web.php::$(cat routes/web.php | tr '\n' '|')"
          rm -rf .git node_modules vendor public/build
          # Workflows van de starterkit mag GITHUB_TOKEN niet pushen: tijdelijk apart zetten.
          if [ -d .github/workflows ]; then mkdir -p starter-workflows && mv .github/workflows/* starter-workflows/ && rmdir .github/workflows; fi
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/boekenbos/. ./
          git config user.name "Lantaarnbos"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Les 4.1.1: nieuw Laravel 13-project (laravel new boekenbos, Livewire-starterkit)"
          git tag les-4-1-1
          git push origin HEAD --tags
